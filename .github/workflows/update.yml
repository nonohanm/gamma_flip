name: Update GEX Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 💡 깃허브 저장소 쓰기 권한 부여

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run script to generate json data
        run: |
          python main.py

      - name: Force commit and push data.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add data.json
          # 강제로 커밋 및 푸시하도록 조건문 수정
          git commit -m "Auto-update GEX dashboard data.json" || echo "No changes to commit"
          git push
