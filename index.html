<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>GammaFlip BTC Dashboard (Client-side)</title>
    <!-- Plotly.js 불러오기 -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { background-color: #080a0f; margin: 0; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #fff; text-align: center; }
        .loading { font-size: 18px; color: #a855f7; margin-top: 50px; }
        .card { background: #111625; border: 1px solid #1e2638; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>⚡ GammaFlip.io 실시간 BTC GEX 대시보드</h2>
        <p id="spot-price-text" style="color: #38bdf8; font-size: 18px; font-weight: bold;">BTC 가격 불러오는 중...</p>
    </div>

    <div class="card">
        <div id="chart-div"></div>
    </div>

    <div class="loading" id="loading-msg">Deribit 옵션 데이터를 불러오는 중입니다... 잠시만 기다려주세요.</div>

    <script>
        // Black-Scholes Gamma 계산 함수 (자바스크립트 버전)
        function normalPdf(x) {
            return Math.exp(-0.5 * x * x) / Math.sqrt(2.0 * Math.PI);
        }

        function calculateBsGamma(S, K, T, sigma) {
            if (T <= 0 || sigma <= 0 || S <= 0 || K <= 0) return 0.0;
            let d1 = (Math.log(S / K) + (0.5 * sigma * sigma) * T) / (sigma * Math.sqrt(T));
            return normalPdf(d1) / (S * sigma * Math.sqrt(T));
        }

        async function fetchAndRender() {
            try {
                // CORS 우회 프록시를 사용하여 Deribit API 호출
                const proxy = "https://api.allorigins.win/raw?url=";
                const indexUrl = encodeURIComponent("https://www.deribit.com/api/v2/public/get_index_price?index_name=btc_usd");
                const summaryUrl = encodeURIComponent("https://www.deribit.com/api/v2/public/get_book_summary_by_currency?currency=BTC&kind=option");

                const [indexRes, summaryRes] = await Promise.all([
                    fetch(proxy + indexUrl).then(r => r.json()),
                    fetch(proxy + summaryUrl).then(r => r.json())
                ]);

                const spotPrice = indexRes.result.index_price;
                const items = summaryRes.result;

                document.getElementById('spot-price-text').innerText = `현재 BTC 가격: $${spotPrice.toLocaleString()}`;

                let strikeMap = {};

                const now = new Date();

                items.forEach(item => {
                    let name = item.instrument_name;
                    let parts = name.split('-');
                    if (parts.length < 4) return;

                    let expStr = parts[1];
                    let strike = parseFloat(parts[2]);
                    let optionType = parts[3] === 'C' ? 'call' : 'put';

                    // 만기일 파싱 (예: 27DEC24)
                    let expDate = parseDeribitDate(expStr);
                    if (!expDate) return;

                    let T = (expDate - now) / (1000 * 60 * 60 * 24 * 365.25);
                    let oi = item.open_interest || 0;
                    let markIv = (item.mark_iv || 60) / 100.0;

                    if (oi > 0 && T > 0) {
                        let gamma = calculateBsGamma(spotPrice, strike, T, markIv);
                        let dollarGamma = gamma * oi * (spotPrice * spotPrice) * 0.01 / 1e6;

                        if (!strikeMap[strike]) strikeMap[strike] = { call: 0, put: 0 };
                        if (optionType === 'call') strikeMap[strike].call += dollarGamma;
                        else strikeMap[strike].put += dollarGamma;
                    }
                });

                // 데이터 정렬 및 필터링 (현재가 기준 ±30%)
                let strikes = Object.keys(strikeMap).map(Number).sort((a, b) => a - b);
                let minS = spotPrice * 0.7;
                let maxS = spotPrice * 1.3;

                let xVals = [];
                let yVals = [];
                let colors = [];

                strikes.forEach(s => {
                    if (s >= minS && s <= maxS) {
                        let net = strikeMap[s].call - strikeMap[s].put;
                        xVals.push(s);
                        yVals.push(net);
                        colors.push(net >= 0 ? '#22c55e' : '#ef4444');
                    }
                });

                // Plotly 차트 그리기
                let trace = {
                    x: xVals,
                    y: yVals,
                    type: 'bar',
                    marker: { color: colors }
                };

                let layout = {
                    title: '<b>BTC Net Gamma Exposure by Strike (Client-side)</b>',
                    titlefont: { color: '#fff' },
                    paper_bgcolor: '#111625',
                    plot_bgcolor: '#111625',
                    font: { color: '#fff' },
                    xaxis: { title: 'Strike Price', gridcolor: '#1e2638' },
                    yaxis: { title: 'Gamma ($M)', gridcolor: '#1e2638', zeroline: true, zerolinecolor: '#fff' },
                    height: 500
                };

                Plotly.newPlot('chart-div', [trace], layout);
                document.getElementById('loading-msg').style.display = 'none';

            } catch (err) {
                console.error(err);
                document.getElementById('loading-msg').innerText = "데이터를 불러오는 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.";
            }
        }

        function parseDeribitDate(str) {
            try {
                let day = parseInt(str.slice(0, 2));
                let monthStr = str.slice(2, 5).toLowerCase();
                let yearStr = str.slice(5);
                let year = parseInt(yearStr.length === 2 ? "20" + yearStr : yearStr);
                
                const months = {jan:0, feb:1, mar:2, apr:3, may:4, jun:5, jul:6, aug:7, sep:8, oct:9, nov:10, dec:11};
                return new Date(Date.UTC(year, months[monthStr], day));
            } catch (e) {
                return null;
            }
        }

        // 페이지 로딩 시 실행
        fetchAndRender();
    </script>
</body>
</html>
